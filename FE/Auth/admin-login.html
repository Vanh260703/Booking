<!DOCTYPE html>

<html class="dark" lang="vi">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Trang Đăng nhập Quản trị viên</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#137fec",
                        "background-light": "#f6f7f8",
                        "background-dark": "#101922",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" },
                },
            },
        }
    </script>
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            font-size: 24px;
        }

        .form-input {
            transition: border-color .15s ease-in-out, box-shadow .15s ease-in-out;
        }
    </style>
</head>

<body class="font-display bg-background-light dark:bg-background-dark">
    <div class="relative flex min-h-screen w-full flex-col items-center justify-center overflow-x-hidden p-4">
        <div class="layout-container flex w-full max-w-md flex-col items-center">
            <div class="flex flex-col items-center gap-4 py-8">
                <span class="material-symbols-outlined text-primary text-5xl">apartment</span>
                <p class="text-lg font-medium text-slate-700 dark:text-slate-300">Hotel Booking System</p>
            </div>
            <div
                class="flex w-full flex-col items-center rounded-xl border border-slate-200 bg-white p-6 dark:border-slate-800 dark:bg-slate-900/50 sm:p-8">
                <div class="flex flex-col items-center">
                    <h1
                        class="text-slate-900 dark:text-white text-2xl sm:text-3xl font-bold tracking-tight text-center">
                        Đăng nhập Quản trị viên</h1>
                    <p
                        class="text-slate-600 dark:text-slate-400 text-sm sm:text-base font-normal leading-normal pt-2 text-center">
                        Chào mừng trở lại. Vui lòng nhập thông tin của bạn.</p>
                </div>
                <form id="loginForm" class="flex w-full flex-col gap-4 pt-8">
                    <div
                        id="formMessage"
                        class="text-lg font-semibold text-center text-red-600 dark:text-red-400 min-h-[1.5rem]"
                        style="display: none"
                    ></div>
                    <label class="flex flex-col flex-1">
                        <p class="text-slate-800 dark:text-slate-200 text-sm font-medium leading-normal pb-2">Tên đăng nhập</p>
                        <input autofocus=""
                            class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg border border-slate-300 bg-slate-50 p-3 text-base font-normal leading-normal text-slate-900 placeholder:text-slate-400 focus:border-primary focus:outline-0 focus:ring-2 focus:ring-primary/20 dark:border-slate-700 dark:bg-slate-800 dark:text-white dark:placeholder:text-slate-500"
                            id="username" placeholder="Nhập tên đăng nhập" type="text" value="" />
                    </label>
                    <label class="flex flex-col flex-1">
                        <p class="text-slate-800 dark:text-slate-200 text-sm font-medium leading-normal pb-2">Mật khẩu
                        </p>
                        <div class="relative flex w-full flex-1 items-stretch">
                            <input
                                class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg border border-slate-300 bg-slate-50 p-3 pr-10 text-base font-normal leading-normal text-slate-900 placeholder:text-slate-400 focus:border-primary focus:outline-0 focus:ring-2 focus:ring-primary/20 dark:border-slate-700 dark:bg-slate-800 dark:text-white dark:placeholder:text-slate-500"
                                id="password" placeholder="Nhập mật khẩu của bạn" type="password" value="" />
                            <button aria-label="Toggle password visibility"
                                class="absolute inset-y-0 right-0 flex items-center justify-center pr-3 text-slate-500 hover:text-primary dark:text-slate-400 dark:hover:text-primary"
                                type="button">
                                <span class="material-symbols-outlined" data-icon="visibility">visibility</span>
                            </button>
                        </div>
                    </label>
                    <div class="flex w-full items-center justify-end pt-1">
                        <a class="text-primary text-sm font-medium leading-normal underline hover:no-underline"
                            href="#">Quên mật khẩu?</a>
                    </div>
                    <button
                        class="flex h-12 w-full items-center justify-center rounded-lg bg-primary px-6 py-3 text-base font-semibold text-white transition-colors hover:bg-primary/90 focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 dark:focus:ring-offset-background-dark"
                        type="submit">
                        Đăng nhập
                    </button>
                    <div class="flex items-center justify-center gap-2 pt-4">
                        <span class="material-symbols-outlined text-sm text-green-600 dark:text-green-500">lock</span>
                        <p class="text-slate-500 dark:text-slate-400 text-xs font-normal">Phiên đăng nhập của bạn được
                            bảo mật.</p>
                    </div>
                </form>
            </div>
            <div class="py-6 text-center">
                <p class="text-slate-500 dark:text-slate-400 text-xs">© 2024 Hotel Booking System. All rights reserved.
                </p>
            </div>
        </div>
    </div>
    <script>
        // helper: showToast top-right (improved animation + spinner -> check)
      function showToast(message, { type = "success", duration = 2500 } = {}) {
        // inject toast CSS once
        if (!document.getElementById("toast-styles")) {
          const css = `
            /* container handled inline when created */
            .toast {
              display:flex;
              align-items:center;
              gap:12px;
              color: #fff;
              padding: 10px 14px;
              border-radius: 10px;
              box-shadow: 0 10px 30px rgba(2,6,23,0.16);
              transform-origin: right top;
              will-change: transform, opacity;
            }
            .toast-enter {
              animation: toastIn 320ms cubic-bezier(.2,.9,.28,1);
            }
            .toast-leave {
              transition: opacity 260ms ease, transform 260ms ease;
              opacity:0;
              transform: translateY(-6px) scale(.995);
            }
            @keyframes toastIn {
              from { opacity:0; transform: translateY(-10px) scale(.98); }
              to { opacity:1; transform: translateY(0) scale(1); }
            }

            .toast-message { font-size:14px; line-height:1; }

            /* spinner */
            .toast-spinner {
              width:28px;
              height:28px;
              display:inline-grid;
              place-items:center;
            }
            .toast-spinner svg { width:22px; height:22px; display:block; }

            .spin {
              animation: spinAnim 900ms linear forwards;
              transform-origin: 50% 50%;
            }
            @keyframes spinAnim {
              from { transform: rotate(0deg); }
              to { transform: rotate(360deg); }
            }

            /* check mark circle */
            .check-wrap {
              width:28px;
              height:28px;
              border-radius:50%;
              display:inline-grid;
              place-items:center;
              transform: scale(0.6) rotate(-10deg);
              opacity:0;
              transition: transform 280ms cubic-bezier(.2,.9,.28,1), opacity 220ms ease;
            }
            .check-wrap.show {
              transform: scale(1) rotate(0deg);
              opacity:1;
            }
            .check-circle {
              width:22px;
              height:22px;
              border-radius:50%;
              display:flex;
              align-items:center;
              justify-content:center;
              background: #10b981; /* green-500 */
              box-shadow: 0 6px 16px rgba(16,185,129,0.16);
            }
            .check-svg {
              width:12px;
              height:12px;
              color:white;
            }
          `;
          const style = document.createElement("style");
          style.id = "toast-styles";
          style.appendChild(document.createTextNode(css));
          document.head.appendChild(style);
        }

        let container = document.getElementById("toast-container");
        if (!container) {
          container = document.createElement("div");
          container.id = "toast-container";
          container.className =
            "fixed top-4 right-4 z-[9999] flex flex-col gap-3 items-end";
          document.body.appendChild(container);
        }

        const bg = type === "success" ? "bg-green-600" : "bg-red-600";
        const toast = document.createElement("div");
        toast.className = `toast ${bg} toast-enter`;
        toast.setAttribute("role", "status");
        toast.setAttribute("aria-live", "polite");

        // inner structure: spinner -> check -> message
        const spinnerWrap = document.createElement("div");
        spinnerWrap.className = "toast-spinner";
        spinnerWrap.innerHTML = `
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <circle cx="12" cy="12" r="8" stroke="rgba(255,255,255,0.16)" stroke-width="3"></circle>
            <circle class="spin" cx="12" cy="12" r="8" stroke="white" stroke-width="3" stroke-linecap="round"
              stroke-dasharray="25 150" stroke-dashoffset="0"></circle>
          </svg>
        `;

        const checkWrap = document.createElement("div");
        checkWrap.className = "check-wrap";
        checkWrap.innerHTML = `
          <div class="check-circle">
            <svg class="check-svg" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M20 6L9 17l-5-5" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
        `;

        const msg = document.createElement("div");
        msg.className = "toast-message";
        msg.textContent = message;

        toast.appendChild(spinnerWrap);
        toast.appendChild(checkWrap);
        toast.appendChild(msg);
        container.appendChild(toast);

        // When spinner finishes one full rotation, swap to check
        const spinDuration = 900; // matches CSS spinAnim
        let swapped = false;
        const swapToCheck = () => {
          if (swapped) return;
          swapped = true;
          // fade out spinner then show check
          spinnerWrap.style.transition = "opacity 180ms ease";
          spinnerWrap.style.opacity = "0";
          setTimeout(() => {
            spinnerWrap.remove();
            checkWrap.classList.add("show");
          }, 190);
        };

        // ensure swap happens after spinDuration (one full rotation)
        const spinTimer = setTimeout(swapToCheck, spinDuration);

        // auto-remove after duration
        const removeTimer = setTimeout(() => {
          // leave animation
          toast.classList.add("toast-leave");
          // cleanup after transition
          setTimeout(() => {
            toast.remove();
          }, 300);
        }, duration);

        // Allow manual removal on click
        toast.addEventListener("click", () => {
          clearTimeout(removeTimer);
          clearTimeout(spinTimer);
          // immediate swap and remove
          swapToCheck();
          toast.classList.add("toast-leave");
          setTimeout(() => toast.remove(), 260);
        });

        // return a dismiss function if caller wants to remove earlier
        return () => {
          clearTimeout(removeTimer);
          clearTimeout(spinTimer);
          toast.classList.add("toast-leave");
          setTimeout(() => toast.remove(), 260);
        };
      }

        const username = document.getElementById('username');
        const password = document.getElementById('password');
        const formMessage = document.getElementById('formMessage');

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const formData = {
                username: this.username.value,
                password: this.password.value,
            };

            const res = await fetch('http://localhost:3000/api/auth/login-admin', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(formData),
                credentials: 'include'
            });

            const data = await res.json();
            console.log(data);

            if (!data.success) {
                formMessage.style.display = 'block';
                formMessage.innerText = data.message;
            } else {
                // Hiển thị toast ở góc phải trên và redirect đến trang login
                showToast(data.message || "Đăng nhập thành công", {
                type: "success",
                duration: 1800,
                });
                // redirect sau một khoảng nhỏ để user thấy toast
                setTimeout(() => {
                  window.location.href = 'http://localhost:5500/FE/Dashboard/admin.html';
                }, 1500);
            }
        })
    </script>
</body>
</html>
