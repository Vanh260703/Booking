<!DOCTYPE html>

<html class="light" lang="vi">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Trang Quên mật khẩu</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
        rel="stylesheet" />
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#137fec",
                        "background-light": "#f6f7f8",
                        "background-dark": "#101922",
                    },
                    fontFamily: {
                        "display": ["Plus Jakarta Sans", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
</head>

<body class="font-display bg-background-light dark:bg-background-dark text-gray-900 dark:text-gray-100">
    <div class="relative flex min-h-screen w-full flex-col items-center justify-center p-4">
        <!-- Header with Logo -->
        <header class="absolute top-0 left-0 w-full p-6">
            <div class="flex items-center gap-2">
                <span class="material-symbols-outlined text-primary text-3xl">
                    king_bed
                </span>
                <span class="text-xl font-bold tracking-tight text-gray-900 dark:text-white">HotelBooking</span>
            </div>
        </header>
        <!-- Main Content -->
        <main class="w-full max-w-md">
            <div class="flex flex-col gap-8">
                <!-- Form Container -->
                <div
                    class="flex w-full flex-col items-center gap-8 rounded-xl border border-gray-200 bg-white p-6 dark:border-gray-700/50 dark:bg-background-dark sm:p-8">
                    <!-- PageHeading Component -->
                    <div class="flex w-full flex-col gap-2 text-center">
                        <h1 class="text-3xl font-black leading-tight tracking-tighter text-[#111418] dark:text-white">
                            Đặt Lại Mật Khẩu</h1>
                        <p class="text-base font-normal text-[#617589] dark:text-gray-400">Nhập email của bạn để nhận
                            hướng dẫn đặt lại mật khẩu.</p>
                    </div>
                    <!-- Form Fields -->
                    <div id="forgotForm" class="flex w-full flex-col gap-5">
                        <div
                            id="formMessage"
                            class="text-lg font-semibold text-center text-red-600 dark:text-red-400 min-h-[1.5rem]"
                            style="display: none"
                        ></div>
                        <!-- TextField Component -->
                        <div class="relative flex flex-col">
                            <label class="pb-2 text-sm font-medium text-[#111418] dark:text-gray-200" for="email">Địa
                                chỉ Email</label>
                            <div class="relative">
                                <span
                                    class="material-symbols-outlined pointer-events-none absolute inset-y-0 left-0 flex items-center pl-4 text-gray-400">
                                    mail
                                </span>
                                <input
                                    class="form-input h-14 w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg border border-[#dbe0e6] bg-white p-[15px] pl-12 text-base font-normal leading-normal text-[#111418] placeholder:text-[#617589] focus:border-primary focus:outline-0 focus:ring-2 focus:ring-primary/20 dark:border-gray-600 dark:bg-gray-800 dark:text-white dark:placeholder-gray-400 dark:focus:border-primary"
                                    id="email" placeholder="example@email.com" type="email" value="" />
                            </div>
                        </div>
                        <!-- SingleButton Component -->
                        <button
                            id="forgotBtn" class="flex h-12 min-w-[84px] w-full cursor-pointer items-center justify-center overflow-hidden rounded-lg bg-primary px-5 text-base font-bold leading-normal tracking-[0.015em] text-white transition-colors hover:bg-primary/90 focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 dark:focus:ring-offset-background-dark">
                            <span class="truncate">Gửi Link Đặt Lại Mật Khẩu</span>
                        </button>
                    </div>
                    <!-- MetaText Component -->
                    <a class="text-center text-sm font-medium leading-normal text-[#617589] underline transition-colors hover:text-primary dark:text-gray-400 dark:hover:text-primary/90"
                        href="login.html">Quay lại trang Đăng nhập</a>
                </div>
            </div>
        </main>
    </div>
    <script>
        // small helper CSS injection for smooth animations
        if (!document.getElementById('fp-anim-styles')) {
            const s = document.createElement('style');
            s.id = 'fp-anim-styles';
            s.textContent = `
                .fp-spin { animation: fp-spin 900ms linear infinite; transform-origin: 50% 50%; }
                @keyframes fp-spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

                .fp-fade-scale {
                  transform: translateY(-6px) scale(.98);
                  opacity: 0;
                  transition: transform 260ms cubic-bezier(.2,.9,.28,1), opacity 260ms ease;
                }
                .fp-fade-scale.show {
                  transform: translateY(0) scale(1);
                  opacity: 1;
                }

                .fp-success-btn {
                  transition: background-color 220ms ease, transform 200ms cubic-bezier(.2,.9,.28,1);
                }
            `;
            document.head.appendChild(s);
        }

        const email = document.getElementById('email');
        const forgotMessage = document.getElementById('formMessage');
        const forgotBtn = document.getElementById('forgotBtn');
        const forgotForm = document.getElementById('forgotForm');

        // helper: create spinner markup
        function spinnerMarkup() {
            return `<svg class="w-5 h-5 fp-spin mr-2" viewBox="0 0 24 24" fill="none" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
                      <circle cx="12" cy="12" r="10" stroke="rgba(255,255,255,0.18)" stroke-width="3"></circle>
                      <path d="M22 12a10 10 0 00-3-7" stroke="white" stroke-width="3" stroke-linecap="round"/>
                    </svg>`;
        }

        // helper: check mark markup
        function checkMarkup() {
            return `<svg class="w-5 h-5 mr-2" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                      <circle cx="12" cy="12" r="10" fill="white" opacity="0.12"></circle>
                      <path d="M20 7L9 18l-5-5" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>`;
        }

        forgotBtn.addEventListener('click', async (e) => {
            e.preventDefault();

            // reset message
            forgotMessage.style.display = 'none';
            forgotMessage.innerText = '';

            // basic validation
            const emailValue = email.value.trim();
            if (!emailValue) {
                forgotMessage.style.display = 'block';
                forgotMessage.innerText = 'Vui lòng nhập địa chỉ email.';
                return;
            }

            // ui: loading
            forgotBtn.disabled = true;
            const originalHtml = forgotBtn.innerHTML;
            forgotBtn.classList.add('fp-success-btn');
            forgotBtn.innerHTML = `${spinnerMarkup()}<span>Đang gửi...</span>`;
            forgotBtn.setAttribute('aria-busy', 'true');

            try {
                const res = await fetch('http://localhost:3000/api/auth/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: emailValue }),
                });

                const data = await res.json();

                if (!data.success) {
                    forgotMessage.style.display = 'block';
                    forgotMessage.innerText = data.message || 'Gửi thất bại. Vui lòng thử lại.';
                    // restore
                    forgotBtn.disabled = false;
                    forgotBtn.innerHTML = originalHtml;
                    forgotBtn.removeAttribute('aria-busy');
                    return;
                }

                // animate button to success (swap spinner -> check)
                forgotBtn.innerHTML = `${checkMarkup()}<span>Đã gửi</span>`;
                forgotBtn.classList.remove('bg-primary');
                forgotBtn.classList.add('bg-green-600');
                // brief scale pop
                forgotBtn.style.transform = 'scale(1.03)';
                setTimeout(() => (forgotBtn.style.transform = ''), 220);

                // small delay so user sees success button, then hide form and show success panel
                setTimeout(() => {
                    // hide the form area smoothly
                    forgotForm.style.transition = 'opacity 260ms ease, transform 260ms cubic-bezier(.2,.9,.28,1)';
                    forgotForm.style.opacity = '0';
                    forgotForm.style.transform = 'translateY(-6px) scale(.995)';
                    setTimeout(() => {
                        forgotForm.style.display = 'none';

                        // success box with entrance animation
                        const successBox = document.createElement('div');
                        successBox.className = 'w-full flex flex-col items-center gap-4 p-6 fp-fade-scale';
                        successBox.innerHTML = `
                            <div class="text-green-600 dark:text-green-400 text-4xl">✔</div>
                            <h3 class="text-lg font-bold text-[#111418] dark:text-white">Email đã được gửi</h3>
                            <p class="text-sm text-gray-600 dark:text-gray-400 text-center">
                              Một liên kết đặt lại mật khẩu đã được gửi đến <strong>${emailValue}</strong>.
                              Vui lòng kiểm tra hộp thư đến (và thư mục spam).
                            </p>
                            <a href="login.html" class="mt-2 inline-block px-5 py-2 rounded-lg bg-primary text-white">Quay lại đăng nhập</a>
                        `;
                        forgotForm.parentNode.insertBefore(successBox, forgotForm.nextSibling);

                        // trigger entrance
                        requestAnimationFrame(() => {
                            successBox.classList.add('show');
                        });

                    }, 260);
                }, 700);

            } catch (err) {
                console.error(err);
                forgotMessage.style.display = 'block';
                forgotMessage.innerText = 'Lỗi mạng. Vui lòng thử lại.';
                forgotBtn.disabled = false;
                forgotBtn.innerHTML = originalHtml;
            } finally {
                // cleanup button state after a bit (if still visible)
                setTimeout(() => {
                    forgotBtn.disabled = false;
                    forgotBtn.removeAttribute('aria-busy');
                    // do not forcibly restore originalHtml immediately so user sees success feedback
                }, 1200);
            }
        });
    </script>
</body>
</html>
