                        id="password"
                        name="password"
                        type="password"
                        placeholder="Nhập vào mật khẩu"
                        class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-[#111418] dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-[#dbe0e6] dark:border-gray-600 bg-background-light dark:bg-gray-800 h-14 placeholder:text-[#617589] pl-12 pr-12 text-base font-normal leading-normal"
                      />

                      <!-- Icon toggle password bên phải -->
                      <button
                        type="button"
                        class="toggle-password absolute right-3 top-1/2 -translate-y-1/2 text-gray-500 dark:text-gray-400"
                        data-target="password"
                      >
                        <span class="material-symbols-outlined select-none"
                          >visibility_off</span
                        >
                      </button>
                    </div>
                  </div>

                  <div class="flex items-center justify-between">
                    <a
                      class="text-sm font-normal text-primary hover:underline"
                      href="forget-password.html"

                  </div>
                  <div>
                    <button
                      class="flex w-full min-w-[84px] cursor-pointer items-center justify-center overflow-hidden rounded-lg h-12 px-5 bg-primary text-white text-base font-bold leading-normal tracking-[0.015em] hover:bg-primary/90 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary/50"
                      type="submit"

                      <span class="truncate">Đăng nhập</span>
                    </button>
                  </div>
                </form>
                <div class="relative">

                  </div>
                  <div class="relative flex justify-center text-sm">

        <footer

    <script>
      // Toggle password visibility
      document.querySelectorAll(".toggle-password").forEach((btn) => {
        btn.addEventListener("click", () => {
          const inputId = btn.getAttribute("data-target");
          const input = document.getElementById(inputId);
          const icon = btn.querySelector("span");
          if (input.type === "password") {
            input.type = "text";
            icon.textContent = "visibility";
          } else {
            input.type = "password";
            icon.textContent = "visibility_off";
          }
        });
      });

      // helper: showToast top-right (improved animation + spinner -> check)
      function showToast(message, { type = "success", duration = 2500 } = {}) {
        // inject toast CSS once
        if (!document.getElementById("toast-styles")) {
          const css = `
            /* container handled inline when created */
            .toast {
              display:flex;
              align-items:center;
              gap:12px;
              color: #fff;
              padding: 10px 14px;
              border-radius: 10px;
              box-shadow: 0 10px 30px rgba(2,6,23,0.16);
              transform-origin: right top;
              will-change: transform, opacity;
            }
            .toast-enter {
              animation: toastIn 320ms cubic-bezier(.2,.9,.28,1);
            }
            .toast-leave {
              transition: opacity 260ms ease, transform 260ms ease;
              opacity:0;
              transform: translateY(-6px) scale(.995);
            }
            @keyframes toastIn {
              from { opacity:0; transform: translateY(-10px) scale(.98); }
              to { opacity:1; transform: translateY(0) scale(1); }
            }

            .toast-message { font-size:14px; line-height:1; }

            /* spinner */
            .toast-spinner {
              width:28px;
              height:28px;
              display:inline-grid;
              place-items:center;
            }
            .toast-spinner svg { width:22px; height:22px; display:block; }

            .spin {
              animation: spinAnim 900ms linear forwards;
              transform-origin: 50% 50%;
            }
            @keyframes spinAnim {
              from { transform: rotate(0deg); }
              to { transform: rotate(360deg); }
            }

            /* check mark circle */
            .check-wrap {
              width:28px;
              height:28px;
              border-radius:50%;
              display:inline-grid;
              place-items:center;
              transform: scale(0.6) rotate(-10deg);
              opacity:0;
              transition: transform 280ms cubic-bezier(.2,.9,.28,1), opacity 220ms ease;
            }
            .check-wrap.show {
              transform: scale(1) rotate(0deg);
              opacity:1;
            }
            .check-circle {
              width:22px;
              height:22px;
              border-radius:50%;
              display:flex;
              align-items:center;
              justify-content:center;
              background: #10b981; /* green-500 */
              box-shadow: 0 6px 16px rgba(16,185,129,0.16);
            }
            .check-svg {
              width:12px;
              height:12px;
              color:white;
            }
          `;
          const style = document.createElement("style");
          style.id = "toast-styles";
          style.appendChild(document.createTextNode(css));
          document.head.appendChild(style);
        }

        let container = document.getElementById("toast-container");
        if (!container) {
          container = document.createElement("div");
          container.id = "toast-container";
          container.className =
            "fixed top-4 right-4 z-[9999] flex flex-col gap-3 items-end";
          document.body.appendChild(container);
        }

        const bg = type === "success" ? "bg-green-600" : "bg-red-600";
        const toast = document.createElement("div");
        toast.className = `toast ${bg} toast-enter`;
        toast.setAttribute("role", "status");
        toast.setAttribute("aria-live", "polite");

        // inner structure: spinner -> check -> message
        const spinnerWrap = document.createElement("div");
        spinnerWrap.className = "toast-spinner";
        spinnerWrap.innerHTML = `
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <circle cx="12" cy="12" r="8" stroke="rgba(255,255,255,0.16)" stroke-width="3"></circle>
            <circle class="spin" cx="12" cy="12" r="8" stroke="white" stroke-width="3" stroke-linecap="round"
              stroke-dasharray="25 150" stroke-dashoffset="0"></circle>
          </svg>
        `;

        const checkWrap = document.createElement("div");
        checkWrap.className = "check-wrap";
        checkWrap.innerHTML = `
          <div class="check-circle">
            <svg class="check-svg" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M20 6L9 17l-5-5" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
        `;

        const msg = document.createElement("div");
        msg.className = "toast-message";
        msg.textContent = message;

        toast.appendChild(spinnerWrap);
        toast.appendChild(checkWrap);
        toast.appendChild(msg);
        container.appendChild(toast);

        // When spinner finishes one full rotation, swap to check
        const spinDuration = 900; // matches CSS spinAnim
        let swapped = false;
        const swapToCheck = () => {
          if (swapped) return;
          swapped = true;
          // fade out spinner then show check
          spinnerWrap.style.transition = "opacity 180ms ease";
          spinnerWrap.style.opacity = "0";
          setTimeout(() => {
            spinnerWrap.remove();
            checkWrap.classList.add("show");
          }, 190);
        };

        // ensure swap happens after spinDuration (one full rotation)
        const spinTimer = setTimeout(swapToCheck, spinDuration);

        // auto-remove after duration
        const removeTimer = setTimeout(() => {
          // leave animation
          toast.classList.add("toast-leave");
          // cleanup after transition
          setTimeout(() => {
            toast.remove();
          }, 300);
        }, duration);

        // Allow manual removal on click
        toast.addEventListener("click", () => {
          clearTimeout(removeTimer);
          clearTimeout(spinTimer);
          // immediate swap and remove
          swapToCheck();
          toast.classList.add("toast-leave");
          setTimeout(() => toast.remove(), 260);
        });

        // return a dismiss function if caller wants to remove earlier
        return () => {
          clearTimeout(removeTimer);
          clearTimeout(spinTimer);
          toast.classList.add("toast-leave");
          setTimeout(() => toast.remove(), 260);
        };
      }

      // Lgoin with Google
      document
        .getElementById("google-register")
        .addEventListener("click", async (e) => {
          window.location.href = "http://localhost:3000/api/auth/google";
        });

      // Register with Facebook
      document
        .getElementById("facebook-register")
        .addEventListener("click", async (e) => {
          window.location.href = "http://localhost:3000/api/auth/facebook";
        });

      // Login with account
      document
        .getElementById("loginForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();

          const messageForm = document.getElementById("formMessage");

          const formData = {
            username: this.username.value,
            password: this.password.value,
          };

          const res = await fetch("http://localhost:3000/api/auth/login", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify(formData),
            credentials: "include",
          });

          const data = await res.json();

          if (!data.success) {
            messageForm.style.display = "block";
            messageForm.innerText = data.message;
          } else {
            // Hiển thị toast ở góc phải trên và redirect đến trang login
            showToast(data.message || "Đăng nhập thành công", {
              type: "success",
              duration: 1800,
            });
            // redirect sau một khoảng nhỏ để user thấy toast
            setTimeout(() => {
              window.location.href = "../index.html";
            }, 1500);
          }
        });
    </script>
