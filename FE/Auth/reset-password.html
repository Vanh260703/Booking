<!DOCTYPE html>

<html class="light" lang="vi">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Trang Đặt lại mật khẩu</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
        rel="stylesheet" />
    <style>
        .material-symbols-outlined {
            font-variation-settings:
                'FILL' 0,
                'wght' 400,
                'GRAD' 0,
                'opsz' 24
        }
    </style>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#137fec",
                        "background-light": "#f6f7f8",
                        "background-dark": "#101922",
                    },
                    fontFamily: {
                        "display": ["Plus Jakarta Sans", "Noto Sans", "sans-serif"]
                    },
                    borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" },
                },
            },
        }
    </script>
</head>

<body class="font-display">
    <div
        class="relative flex h-auto min-h-screen w-full flex-col bg-background-light dark:bg-background-dark group/design-root overflow-x-hidden">
        <div class="layout-container flex h-full grow flex-col">
            <header class="flex items-center justify-between whitespace-nowrap px-4 sm:px-10 py-3">
                <div class="flex items-center gap-4 text-slate-800 dark:text-white">
                    <div class="h-6 w-6">
                        <svg fill="currentColor" viewbox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
                            <path clip-rule="evenodd" d="M24 4H42V17.3333V30.6667H24V44H6V30.6667V17.3333H24V4Z"
                                fill-rule="evenodd"></path>
                        </svg>
                    </div>
                    <h2 class="text-lg font-bold tracking-[-0.015em]">HotelGo</h2>
                </div>
            </header>
            <main class="flex flex-1 items-center justify-center py-10 px-4">
                <div
                    class="flex w-full max-w-md flex-col items-center gap-8 rounded-xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-background-dark p-6 sm:p-10">
                    <div class="flex w-full flex-col gap-3 text-center">
                        <p
                            class="text-3xl sm:text-4xl font-black leading-tight tracking-[-0.033em] text-slate-900 dark:text-white">
                            Đặt lại mật khẩu</p>
                        <p class="text-base font-normal leading-normal text-slate-600 dark:text-slate-400">Vui lòng nhập
                            mật khẩu mới của bạn bên dưới.</p>
                    </div>
                    <div class="flex w-full flex-col gap-6">
                        <div
                            id="formMessage"
                            class="text-lg font-semibold text-center text-red-600 dark:text-red-400 min-h-[1.5rem]"
                            style="display: none"
                        ></div>
                        <div class="flex w-full flex-col gap-3">
                            <label class="flex flex-col">
                                <p class="pb-2 text-base font-medium leading-normal text-slate-900 dark:text-white">Mật
                                    khẩu mới</p>
                                <div
                                    class="flex w-full flex-1 items-stretch rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800/50 focus-within:border-primary dark:focus-within:border-primary">
                                    <input
                                        class="form-input h-14 flex-1 resize-none overflow-hidden rounded-l-lg border-0 bg-transparent p-4 text-base font-normal leading-normal text-slate-900 dark:text-white placeholder:text-slate-500 dark:placeholder:text-slate-400 focus:outline-0 focus:ring-0"
                                        placeholder="Nhập mật khẩu mới" id="password" name="password" type="password" value="" />
                                    <button
                                        type="button"
                                        class="toggle-password flex items-center justify-center px-4 text-slate-500 dark:text-slate-400"
                                        data-target="password">
                                        <span class="material-symbols-outlined text-2xl">visibility_off</span>
                                    </button>
                                </div>
                            </label>
                            <p class="px-1 text-sm font-normal leading-normal text-slate-600 dark:text-slate-400">Tối
                                thiểu 8 ký tự, bao gồm chữ hoa, chữ thường và số.</p>
                        </div>
                        <label class="flex flex-col">
                            <p class="pb-2 text-base font-medium leading-normal text-slate-900 dark:text-white">Xác nhận
                                mật khẩu mới</p>
                            <div
                                class="flex w-full flex-1 items-stretch rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800/50 focus-within:border-primary dark:focus-within:border-primary">
                                <input
                                    class="form-input h-14 flex-1 resize-none overflow-hidden rounded-l-lg border-0 bg-transparent p-4 text-base font-normal leading-normal text-slate-900 dark:text-white placeholder:text-slate-500 dark:placeholder:text-slate-400 focus:outline-0 focus:ring-0"
                                    placeholder="Nhập lại mật khẩu mới" id="confirmPassword" name="confirmPassword" type="password" value="" />
                                <button
                                    type="button"
                                    class="toggle-password flex items-center justify-center px-4 text-slate-500 dark:text-slate-400"
                                    data-target="confirmPassword">
                                    <span class="material-symbols-outlined text-2xl">visibility_off</span>
                                </button>
                            </div>
                        </label>
                    </div>
                    <div class="flex w-full flex-col items-center gap-4">
                        <button
                            id="updatePasswordBtn" class="flex h-12 w-full items-center justify-center gap-2 rounded-lg bg-primary px-6 text-base font-bold text-white transition-colors hover:bg-primary/90">Cập
                            nhật mật khẩu</button>
                        <a class="flex items-center gap-2 text-sm font-medium text-slate-600 dark:text-slate-400 hover:text-primary dark:hover:text-primary"
                            href="login.html">
                            <span class="material-symbols-outlined text-base">arrow_back</span>
                            Quay lại Đăng nhập
                        </a>
                    </div>
                </div>
            </main>
        </div>
    </div>
    <script>
        // Toggle password visibility
        document.querySelectorAll(".toggle-password").forEach((btn) => {
            btn.addEventListener("click", () => {
            const inputId = btn.getAttribute("data-target");
            const input = document.getElementById(inputId);
            const icon = btn.querySelector("span");
            if (input.type === "password") {
                input.type = "text";
                icon.textContent = "visibility";
            } else {
                input.type = "password";
                icon.textContent = "visibility_off";
            }
            });
        });

        const queryString = window.location.search;

        // Chuyển thành object để dễ truy xuất
        const urlParams = new URLSearchParams(queryString);

        // Lấy giá trị resetToken
        const resetToken = urlParams.get('resetToken');

        if (!resetToken) {
            window.location.href = 'http://localhost:5500/FE/Error/403.html';
        } else {
            const password = document.getElementById('password');
            const confirmPassword = document.getElementById('confirmPassword');
            const formMessage = document.getElementById('formMessage');
            const updateBtn = document.getElementById('updatePasswordBtn');

            // inject animations once
            if (!document.getElementById('rp-anim-styles')) {
                const style = document.createElement('style');
                style.id = 'rp-anim-styles';
                style.textContent = `
                  .rp-spin { animation: rp-spin 900ms linear infinite; transform-origin: 50% 50%; }
                  @keyframes rp-spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

                  .rp-success {
                    background-color: #10b981 !important; /* green */
                    transform: scale(1.03);
                    transition: transform 220ms cubic-bezier(.2,.9,.28,1), background-color 200ms ease;
                  }

                  .rp-fade {
                    transition: opacity 260ms ease, transform 260ms cubic-bezier(.2,.9,.28,1);
                  }
                `;
                document.head.appendChild(style);
            }

            function spinnerMarkup() {
                return `<svg class="w-5 h-5 rp-spin mr-2" viewBox="0 0 24 24" fill="none" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
                          <circle cx="12" cy="12" r="10" stroke="rgba(255,255,255,0.18)" stroke-width="3"></circle>
                          <path d="M22 12a10 10 0 00-3-7" stroke="white" stroke-width="3" stroke-linecap="round"/>
                        </svg>`;
            }

            function checkMarkup() {
                return `<svg class="w-5 h-5 mr-2" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                          <circle cx="12" cy="12" r="10" fill="white" opacity="0.12"></circle>
                          <path d="M20 7L9 18l-5-5" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>`;
            }

            updateBtn.addEventListener('click', async (e) => {
                e.preventDefault();
                formMessage.style.display = 'none';
                formMessage.innerText = '';

                const pw = password.value.trim();
                const cpw = confirmPassword.value.trim();

                if (!pw || !cpw) {
                    formMessage.style.display = 'block';
                    formMessage.innerText = 'Vui lòng nhập đầy đủ trường mật khẩu.';
                    return;
                }
                if (pw.length < 8) {
                    formMessage.style.display = 'block';
                    formMessage.innerText = 'Mật khẩu phải có ít nhất 8 ký tự.';
                    return;
                }
                if (pw !== cpw) {
                    formMessage.style.display = 'block';
                    formMessage.innerText = 'Mật khẩu xác nhận không khớp.';
                    return;
                }

                // ui: loading state
                updateBtn.disabled = true;
                const originalHtml = updateBtn.innerHTML;
                updateBtn.innerHTML = `${spinnerMarkup()}<span>Đang cập nhật...</span>`;
                updateBtn.setAttribute('aria-busy', 'true');

                try {
                    const res = await fetch(`http://localhost:3000/api/auth/reset-password?resetToken=${encodeURIComponent(resetToken)}`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ password: pw, confirmPassword: cpw })
                    });

                    const data = await res.json();

                    if (!data.success) {
                        formMessage.style.display = 'block';
                        formMessage.innerText = data.message || 'Cập nhật thất bại. Vui lòng thử lại.';
                        updateBtn.disabled = false;
                        updateBtn.innerHTML = originalHtml;
                        updateBtn.removeAttribute('aria-busy');
                        return;
                    }

                    // success animation: spinner -> check + green
                    updateBtn.innerHTML = `${checkMarkup()}<span>Đã cập nhật</span>`;
                    updateBtn.classList.add('rp-success');
                    // small pop effect
                    setTimeout(() => updateBtn.style.transform = '', 250);

                    // show subtle success message
                    formMessage.style.display = 'block';
                    formMessage.style.color = '#059669'; // green-600
                    formMessage.innerText = data.message || 'Mật khẩu đã được cập nhật.';

                    // after short delay redirect to login
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 1400);

                } catch (err) {
                    console.error(err);
                    formMessage.style.display = 'block';
                    formMessage.innerText = 'Lỗi mạng. Vui lòng thử lại.';
                    updateBtn.disabled = false;
                    updateBtn.innerHTML = originalHtml;
                    updateBtn.removeAttribute('aria-busy');
                }
            });
        }
    </script>
</body>
</html>
